<!DOCTYPE html><html><head><meta charset="utf-8"><title>Chronos Diamond: The Eternal Clicker</title><style>body{margin:0;background:#030712;color:#f3f4f6;font-family:'Segoe UI',system-ui,sans-serif;display:flex;height:100vh;overflow:hidden}#story-overlay{position:fixed;inset:0;background:rgba(3,7,18,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px;text-align:center;transition:opacity 0.5s}#story-text{max-width:600px;font-size:1.25rem;line-height:1.6;margin-bottom:2rem;color:#9ca3af}.btn{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;border:none;padding:12px 24px;font-size:1rem;font-weight:600;border-radius:8px;cursor:pointer;box-shadow:0 4px 14px rgba(139,92,246,0.4);transition:transform 0.2s,filter 0.2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.sidebar{width:350px;background:#0b0f19;border-right:1px solid #1f2937;display:flex;flex-direction:column;padding:20px}#stats-panel{background:#111827;padding:15px;border-radius:12px;border:1px solid #374151;margin-bottom:20px}.stat-row{display:flex;justify-content:space-between;margin:8px 0;font-size:0.95rem}.stat-val{font-weight:700;color:#38bdf8}#upgrades-container{flex:1;overflow-y:auto;padding-right:5px}.upgrade-card{background:#1f2937;border:1px solid #374151;border-radius:8px;padding:12px;margin-bottom:10px;cursor:pointer;transition:background 0.2s,border-color 0.2s}.upgrade-card:hover{background:#374151;border-color:#4b5563}.upgrade-card.disabled{opacity:0.5;cursor:not-allowed;background:#111827}.upgrade-name{font-weight:600;color:#f3f4f6;margin-bottom:4px}.upgrade-desc{font-size:0.8rem;color:#9ca3af;margin-bottom:6px}.upgrade-cost{font-size:0.85rem;color:#fbbf24;font-weight:600}#game-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at center,#111827 0%,#030712 100%)}#diamond-container{position:relative;width:300px;height:300px;display:flex;align-items:center;justify-content:center;cursor:pointer}#diamond{width:220px;height:220px;background:linear-gradient(135deg,rgba(255,255,255,0.9) 0%,rgba(186,230,253,0.8) 20%,rgba(56,189,248,0.6) 40%,rgba(139,92,246,0.5) 60%,rgba(236,72,153,0.4) 80%,rgba(255,255,255,0.9) 100%);clip-path:polygon(50% 0%,85% 20%,100% 50%,85% 80%,50% 100%,15% 80%,0% 50%,15% 20%);filter:drop-shadow(0 0 30px rgba(56,189,248,0.6)) drop-shadow(0 0 60px rgba(139,92,246,0.3));transition:transform 0.05s ease;position:relative}#diamond::before{content:'';position:absolute;inset:4px;background:linear-gradient(135deg,rgba(255,255,255,0.4) 0%,transparent 50%,rgba(0,0,0,0.3) 100%);clip-path:polygon(50% 0%,85% 20%,100% 50%,85% 80%,50% 100%,15% 80%,0% 50%,15% 20%);z-index:2}#diamond::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,0.15) 0px,rgba(255,255,255,0.15) 2px,transparent 2px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,255,255,0.15) 0px,rgba(255,255,255,0.15) 2px,transparent 2px,transparent 10px);z-index:3;opacity:0.8}.diamond-facet{position:absolute;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);z-index:4;pointer-events:none}#diamond:active{transform:scale(0.95) rotate(2deg);filter:drop-shadow(0 0 45px rgba(56,189,248,0.9))}.floating-text{position:absolute;color:#38bdf8;font-weight:800;font-size:1.5rem;pointer-events:none;animation:floatUp 0.8s ease-out forwards;text-shadow:0 0 8px rgba(0,0,0,1);z-index:10}@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-100px) scale(0.8)}}#log-box{position:absolute;bottom:20px;left:20px;right:20px;height:100px;background:rgba(11,15,25,0.8);border:1px solid #1f2937;border-radius:8px;padding:10px;overflow-y:auto;font-size:0.85rem;color:#9ca3af;display:flex;flex-direction:column-reverse}</style></head><body><div id="story-overlay"><div id="story-text">Loading reality...</div><button class="btn" id="story-btn" onclick="advanceStory()">Begin Exploration</button></div><div class="sidebar"><div id="stats-panel"><div class="stat-row"><span>Chronos Shards:</span><span id="stat-shards" class="stat-val">0</span></div><div class="stat-row"><span>Per Click:</span><span id="stat-dpc" class="stat-val">1</span></div><div class="stat-row"><span>Per Second:</span><span id="stat-dps" class="stat-val">0</span></div></div><div id="upgrades-container"></div></div><div id="game-main"><div id="diamond-container" onclick="clickDiamond(event)"><div id="diamond"><div class="diamond-facet" style="top:0;left:25%;width:50%;height:20%;clip-path:polygon(0% 100%,25% 0%,75% 0%,100% 100%)"></div><div class="diamond-facet" style="top:20%;left:0;width:50%;height:30%;clip-path:polygon(0% 0%,100% 0%,50% 100%)"></div><div class="diamond-facet" style="top:20%;left:50%;width:50%;height:30%;clip-path:polygon(0% 0%,100% 0%,50% 100%)"></div><div class="diamond-facet" style="top:50%;left:0;width:100%;height:50%;clip-path:polygon(0% 0%,50% 100%,100% 0%)"></div></div></div><div id="log-box"></div></div><script>let game={shards:0,totalShards:0,dpc:1,dps:0,storyStage:0};const storySegments=[{text:"In the year 3084, humanity discovered the Chronos Nexus—a single, hyper-dimensional geometric crystal anchoring time itself. Tapping its matrix releases pure temporal energy.",btn:"Harvest Energy"},{text:"The Nexus responds to your touch. Splinters of timeline realities are breaking off. We need deeper extraction arrays to stabilize the paradox.",btn:"Continue Harvesting"},{text:"Warning: Quantum fluctuations detected. The diamond's structural matrix is shifting across alternate realities. We are rewriting history with every fraction extracted.",btn:"Ascend Reality"}];const upgrades=[{id:"u1",name:"Quantum Pick",desc:"Extracts micro-fractures in time.",cost:15,dpc:1,dps:0,count:0},{id:"u2",name:"Temporal Drone",desc:"Automates chronological mining.",cost:100,dpc:0,dps:1,count:0},{id:"u3",name:"Sub-Atomic Laser",desc:"Beams coherent photons into the crystal core.",cost:500,dpc:5,dps:0,count:0},{id:"u4",name:"Wormhole Siphon",desc:"Sucks energy raw from auxiliary universes.",cost:2500,dpc:0,dps:15,count:0},{id:"u5",name:"Chronos Overdrive",desc:"Forces reality to compress, multiplying all active outputs.",cost:15000,dpc:50,dps:100,count:0},{id:"u6",name:"Singularity Engine",desc:"Collapses redundant worldlines straight into shards.",cost:100000,dpc:500,dps:1000,count:0}];function init(){advanceStory();renderUpgrades();setInterval(gameLoop,1000);logMessage("Chronos Nexus interface initialized successfully.");}function advanceStory(){const s=storySegments[game.storyStage];if(s){document.getElementById("story-text").innerText=s.text;document.getElementById("story-btn").innerText=s.btn;if(game.storyStage>0)document.getElementById("story-overlay").style.opacity="0";setTimeout(()=>{if(game.storyStage>0)document.getElementById("story-overlay").style.display="none";},500);game.storyStage++;}else{document.getElementById("story-overlay").style.display="none";}}function logMessage(m){const b=document.getElementById("log-box");b.innerHTML+=`<div>[SYS]: ${m}</div>`;}function updateUI(){document.getElementById("stat-shards").innerText=Math.floor(game.shards).toLocaleString();document.getElementById("stat-dpc").innerText=game.dpc.toLocaleString();document.getElementById("stat-dps").innerText=game.dps.toLocaleString();upgrades.forEach(u=>{const el=document.getElementById(u.id);if(el){el.querySelector(".upgrade-cost").innerText=`Cost: ${Math.floor(u.cost).toLocaleString()} Shards`;if(game.shards>=u.cost){el.classList.remove("disabled")}else{el.classList.add("disabled")}}});}function clickDiamond(e){game.shards+=game.dpc;game.totalShards+=game.dpc;createFloatingText(e.clientX,e.clientY,`+${game.dpc}`);updateUI();if(game.totalShards>=50&&game.storyStage===1){document.getElementById("story-overlay").style.display="flex";document.getElementById("story-overlay").style.opacity="1";advanceStory();logMessage("Anomaly detected. Matrix shifting.");}if(game.totalShards>=1000&&game.storyStage===2){document.getElementById("story-overlay").style.display="flex";document.getElementById("story-overlay").style.opacity="1";advanceStory();logMessage("The timeline begins to fracture under massive pressure.");}}function createFloatingText(x,y,t){const f=document.createElement("div");f.className="floating-text";f.innerText=t;f.style.left=`${x-20}px`;f.style.top=`${y-20}px`;document.body.appendChild(f);setTimeout(()=>f.remove(),800);}function renderUpgrades(){const container=document.getElementById("upgrades-container");container.innerHTML="";upgrades.forEach(u=>{const d=document.createElement("div");d.id=u.id;d.className="upgrade-card disabled";d.innerHTML=`<div class="upgrade-name">${u.name} (${u.count})</div><div class="upgrade-desc">${u.desc}</div><div class="upgrade-cost">Cost: ${u.cost}</div>`;d.onclick=()=>buyUpgrade(u);container.appendChild(d);});}function buyUpgrade(u){if(game.shards>=u.cost){game.shards-=u.cost;u.count++;game.dpc+=u.dpc;game.dps+=u.dps;u.cost*=1.15;logMessage(`Acquired [${u.name}]. Output parameters updated.`);renderUpgrades();updateUI();}}function gameLoop(){if(game.dps>0){game.shards+=game.dps;game.totalShards+=game.dps;updateUI();}}window.onload=init;</script></body></html>
